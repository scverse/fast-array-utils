version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
      # https://github.com/pypa/hatch/pull/2382
      - UV_TOOL_BIN_DIR=$HOME/.asdf/bin uv tool install git+https://github.com/pypa/hatch.git@ed8e30bebf98f2fe4d70c18a32a50a8160c391cb
    build:
      html:
        - hatch run docs:build
        - mv docs/_build $READTHEDOCS_OUTPUT
