repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
    groups: [format]
  - id: trailing-whitespace
    groups: [format]
  - id: no-commit-to-branch
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.8
  hooks:
  - id: ruff-check
    args: [--fix, --exit-non-zero-on-fix]
  - id: ruff-check
    args: [--preview, --select=CPY]
  - id: ruff-format
    groups: [format]
- repo: https://github.com/tox-dev/pyproject-fmt
  rev: v2.29.4
  hooks:
  - id: pyproject-fmt
    groups: [format]
- repo: https://github.com/biomejs/pre-commit
  rev: v2.5.14
  hooks:
  - id: biome-format
    groups: [format]
- repo: local
  hooks:
  - id: mypy
    name: mypy
    entry: hatch check types
    language: system
    types_or: [python, pyi]
    require_serial: true
    pass_filenames: false
    groups: [typecheck]
